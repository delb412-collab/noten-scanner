# Baut die Handy-App (app/) und veröffentlicht sie über GitHub Pages.
# Einmalig in GitHub einstellen: Settings → Pages → Source: "GitHub Actions".
name: Handy-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: App bauen (mit der Adresse des Vereins-Servers, falls eingerichtet)
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -n "$HF_SPACE" ]; then
            export SERVER_ADRESSE="https://$(echo "$HF_SPACE" | tr '/_.' '---' | tr 'A-Z' 'a-z').hf.space"
          fi
          python app/bauen.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
